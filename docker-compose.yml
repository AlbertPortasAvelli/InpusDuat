

services:
  db:
    image: postgres:15
    container_name: inpusduat-db
    environment:
      POSTGRES_DB: inpusduat
      POSTGRES_USER: inpusduat
      POSTGRES_PASSWORD: inpusduat123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: inpusduat-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  pgdata:
  esdata: